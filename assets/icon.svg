<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  
  <defs>
    <!-- Background Walnut Gradients -->
    <linearGradient id="walnutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2c17"/>
      <stop offset="35%" stop-color="#382113"/>
      <stop offset="75%" stop-color="#24150c"/>
      <stop offset="100%" stop-color="#140b06"/>
    </linearGradient>

    <!-- Bevel light overlay -->
    <linearGradient id="edgeBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="10%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="90%" stop-color="#000000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Metallic Gold/Brass Bezel -->
    <linearGradient id="brassBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="18%" stop-color="#fbbf24"/>
      <stop offset="42%" stop-color="#d97706"/>
      <stop offset="68%" stop-color="#fef3c7"/>
      <stop offset="85%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>

    <linearGradient id="brassSpun" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="65%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Telescopic Antenna Metallic Chrome -->
    <linearGradient id="antennaChrome" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#e2e8f0"/>
      <stop offset="65%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- Backlit Cream/Amber Analog Radio Dial Glass -->
    <linearGradient id="dialGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fef3c7"/>
      <stop offset="70%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Radio Cabinet Body Finish -->
    <linearGradient id="cabinetFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2c251f"/>
      <stop offset="40%" stop-color="#1f1a15"/>
      <stop offset="100%" stop-color="#120e0b"/>
    </linearGradient>

    <!-- Handle Leather Strap -->
    <linearGradient id="handleLeather" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5c381e"/>
      <stop offset="50%" stop-color="#3d2314"/>
      <stop offset="100%" stop-color="#1f1007"/>
    </linearGradient>

    <!-- Glowing Green ON AIR Jewel -->
    <radialGradient id="jewelGreen" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#a7f3d0"/>
      <stop offset="30%" stop-color="#10b981"/>
      <stop offset="70%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </radialGradient>

    <!-- Perforated Speaker Grille Texture Pattern -->
    <pattern id="speakerGrille" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#14110e"/>
      <circle cx="4" cy="4" r="2.8" fill="#050403"/>
      <circle cx="12" cy="12" r="2.8" fill="#050403"/>
    </pattern>

    <!-- Drop Shadows and Glow Filters -->
    <filter id="chassisShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="dialShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="needleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ef4444" flood-opacity="0.95"/>
    </filter>

    <filter id="lampGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#10b981" flood-opacity="0.9"/>
    </filter>
  </defs>
  
  <rect width="1024" height="1024" rx="224" fill="url(#walnutBg)"/>
       <rect x="8" y="8" width="1008" height="1008" rx="216" fill="none" stroke="url(#brassBezel)" stroke-width="14" opacity="0.8"/>
       <rect width="1024" height="1024" rx="224" fill="url(#edgeBevel)"/>
  
  <g id="radioArtwork">
    <!-- Diagonal Telescopic Antenna extending from top right -->
    <g id="antenna">
      <!-- Antenna Base Bracket on Radio -->
      <rect x="740" y="284" width="28" height="24" rx="6" fill="url(#brassBezel)" stroke="#78350f" stroke-width="2"/>
      <circle cx="754" cy="288" r="7" fill="#475569"/>
      <!-- Lower thicker telescopic segment -->
      <line x1="754" y1="288" x2="840" y2="152" stroke="url(#antennaChrome)" stroke-width="15" stroke-linecap="round"/>
      <line x1="754" y1="288" x2="840" y2="152" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      <!-- Upper thinner telescopic segment -->
      <line x1="840" y1="152" x2="888" y2="76" stroke="url(#antennaChrome)" stroke-width="10" stroke-linecap="round"/>
      <circle cx="840" cy="152" r="8" fill="url(#brassBezel)"/>
      <!-- Chrome Tip Ball -->
      <circle cx="888" cy="76" r="14" fill="url(#antennaChrome)" stroke="#64748b" stroke-width="2"/>
      <circle cx="885" cy="73" r="4" fill="#ffffff" opacity="0.8"/>
    </g>

    <!-- Top Leather Handle with Brass Mounts -->
    <g id="topHandle">
      <!-- Arched Leather Strap -->
      <path d="M 330 300 Q 512 210 694 300" fill="none" stroke="url(#handleLeather)" stroke-width="26" stroke-linecap="round"/>
      <path d="M 330 300 Q 512 210 694 300" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
      <!-- Brass Left Bracket -->
      <rect x="314" y="288" width="32" height="22" rx="4" fill="url(#brassBezel)" stroke="#78350f" stroke-width="2"/>
      <circle cx="330" cy="299" r="4" fill="#1f1007"/>
      <!-- Brass Right Bracket -->
      <rect x="678" y="288" width="32" height="22" rx="4" fill="url(#brassBezel)" stroke="#78350f" stroke-width="2"/>
      <circle cx="694" cy="299" r="4" fill="#1f1007"/>
    </g>

    <!-- Main Radio Chassis / Cabinet Body -->
    <g id="mainCabinet" filter="url(#chassisShadow)">
      <!-- Outer Brushed Gold/Brass Bezel Border -->
      <rect x="152" y="300" width="720" height="576" rx="44" fill="url(#brassBezel)"/>
      
      <!-- Inner Dark Woodgrain/Bakelite Chassis Face -->
      <rect x="168" y="316" width="688" height="544" rx="32" fill="url(#cabinetFace)"/>
      <rect x="168" y="316" width="688" height="544" rx="32" fill="none" stroke="#000000" stroke-width="4" opacity="0.6"/>

      <!-- Corner Chassis Screws -->
      <circle cx="196" cy="344" r="7" fill="url(#brassSpun)"/>
      <line x1="192" y1="340" x2="200" y2="348" stroke="#1f1007" stroke-width="2"/>
      <circle cx="828" cy="344" r="7" fill="url(#brassSpun)"/>
      <line x1="824" y1="340" x2="832" y2="348" stroke="#1f1007" stroke-width="2"/>
      <circle cx="196" cy="832" r="7" fill="url(#brassSpun)"/>
      <line x1="192" y1="828" x2="200" y2="836" stroke="#1f1007" stroke-width="2"/>
      <circle cx="828" cy="832" r="7" fill="url(#brassSpun)"/>
      <line x1="824" y1="828" x2="832" y2="836" stroke="#1f1007" stroke-width="2"/>

      <!-- TOP SECTION: Warm Illuminated Analog Radio Frequency Dial -->
      <g id="tunerDial" filter="url(#dialShadow)">
        <!-- Recessed Brass Bezel -->
        <rect x="206" y="360" width="612" height="176" rx="18" fill="url(#brassBezel)"/>
        <!-- Inner Dial Glass Backlit Window -->
        <rect x="214" y="368" width="596" height="160" rx="12" fill="url(#dialGlass)"/>
        
        <!-- Subtle Inner Glass Shadow / Reflection -->
        <rect x="214" y="368" width="596" height="160" rx="12" fill="none" stroke="#92400e" stroke-width="3" opacity="0.7"/>
        <path d="M 214 368 L 480 368 L 320 528 L 214 528 Z" fill="#ffffff" opacity="0.18"/>

        <!-- FM Dial Header Text -->
        <text x="512" y="394" font-family="monospace, sans-serif" font-size="14" font-weight="900" fill="#78350f" text-anchor="middle" letter-spacing="4">FM STEREO • SOLID STATE 1970</text>
        
        <!-- Frequency Scale Numbers (88 to 108 MHz) -->
        <g fill="#451a03" font-family="monospace, sans-serif" font-size="19" font-weight="900" text-anchor="middle">
          <text x="260" y="430">88</text>
          <text x="360" y="430">92</text>
          <text x="460" y="430">96</text>
          <text x="560" y="430" fill="#991b1b" font-size="22">100</text>
          <text x="660" y="430">104</text>
          <text x="760" y="430">108</text>
        </g>

        <!-- Frequency Tick Marks Line -->
        <g stroke="#78350f" stroke-width="2.5" opacity="0.8">
          <line x1="260" y1="442" x2="260" y2="456"/>
          <line x1="285" y1="444" x2="285" y2="452" stroke-width="1.5"/>
          <line x1="310" y1="444" x2="310" y2="452" stroke-width="1.5"/>
          <line x1="335" y1="444" x2="335" y2="452" stroke-width="1.5"/>
          <line x1="360" y1="442" x2="360" y2="456"/>
          <line x1="385" y1="444" x2="385" y2="452" stroke-width="1.5"/>
          <line x1="410" y1="444" x2="410" y2="452" stroke-width="1.5"/>
          <line x1="435" y1="444" x2="435" y2="452" stroke-width="1.5"/>
          <line x1="460" y1="442" x2="460" y2="456"/>
          <line x1="485" y1="444" x2="485" y2="452" stroke-width="1.5"/>
          <line x1="510" y1="440" x2="510" y2="460" stroke="#b91c1c" stroke-width="3"/>
          <line x1="535" y1="444" x2="535" y2="452" stroke-width="1.5"/>
          <line x1="560" y1="442" x2="560" y2="456"/>
          <line x1="585" y1="444" x2="585" y2="452" stroke-width="1.5"/>
          <line x1="610" y1="444" x2="610" y2="452" stroke-width="1.5"/>
          <line x1="635" y1="444" x2="635" y2="452" stroke-width="1.5"/>
          <line x1="660" y1="442" x2="660" y2="456"/>
          <line x1="685" y1="444" x2="685" y2="452" stroke-width="1.5"/>
          <line x1="710" y1="444" x2="710" y2="452" stroke-width="1.5"/>
          <line x1="735" y1="444" x2="735" y2="452" stroke-width="1.5"/>
          <line x1="760" y1="442" x2="760" y2="456"/>
        </g>

        <!-- Dynamic Glowing Red Analog Tuning Needle -->
        <g id="tuningNeedle" filter="url(#needleGlow)">
          <line x1="510" y1="372" x2="510" y2="520" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
          <circle cx="510" cy="378" r="6" fill="#ef4444"/>
          <circle cx="510" cy="514" r="5" fill="#ef4444"/>
        </g>

        <!-- Lower Sub-Scale Indicator -->
        <text x="512" y="500" font-family="monospace, sans-serif" font-size="12" font-weight="bold" fill="#92400e" text-anchor="middle" letter-spacing="2">LOG SCALE 0 - 100 • HIGH FIDELITY</text>
      </g>

      <!-- BOTTOM SECTION: Speaker Grille + Controls -->
      <!-- Left: Perforated Speaker Grille -->
      <g id="speakerSection">
        <rect x="206" y="562" width="418" height="268" rx="20" fill="url(#brassBezel)"/>
        <rect x="214" y="570" width="402" height="252" rx="14" fill="url(#speakerGrille)"/>
        <rect x="214" y="570" width="402" height="252" rx="14" fill="none" stroke="#000000" stroke-width="5" opacity="0.7"/>

        <!-- Embossed Vintage Brand Plate on Speaker -->
        <g id="brandPlate">
          <rect x="236" y="590" width="168" height="34" rx="6" fill="url(#brassBezel)" stroke="#78350f" stroke-width="2"/>
          <text x="320" y="613" font-family="sans-serif" font-size="14" font-weight="900" fill="#382113" text-anchor="middle" letter-spacing="1">רדיו סבא יצחק</text>
        </g>
      </g>

      <!-- Right: Vintage Mechanical Controls Cluster -->
      <g id="controlsCluster">
        <!-- 1. Glowing Green ON AIR Jewel Indicator -->
        <g id="onAirJewel">
          <circle cx="718" cy="600" r="28" fill="url(#brassBezel)"/>
          <circle cx="718" cy="600" r="24" fill="#064e3b" stroke="#000000" stroke-width="2"/>
          <circle cx="718" cy="600" r="19" fill="url(#jewelGreen)" filter="url(#lampGlow)"/>
          <circle cx="712" cy="594" r="6" fill="#ffffff" opacity="0.6"/>
          <text x="718" y="640" font-family="monospace, sans-serif" font-size="12" font-weight="900" fill="#34d399" text-anchor="middle" letter-spacing="1">ON AIR</text>
        </g>

        <!-- 2. Upper Chunky Brass/Bakelite Knob (VOLUME) -->
        <g id="knobVolume">
          <!-- Drop Shadow -->
          <circle cx="718" cy="700" r="44" fill="#000000" opacity="0.6"/>
          <!-- Outer Knurled Brass Ring -->
          <circle cx="718" cy="696" r="42" fill="url(#brassBezel)"/>
          <!-- Inner Dark Bakelite Core -->
          <circle cx="718" cy="696" r="32" fill="#181410" stroke="#78350f" stroke-width="2"/>
          <!-- Volume Notch Indicator Line (Pointing at ~10 o'clock) -->
          <line x1="718" y1="696" x2="698" y2="676" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
          <!-- Center Spun Brass Cap -->
          <circle cx="718" cy="696" r="14" fill="url(#brassSpun)"/>
          <circle cx="715" cy="693" r="4" fill="#ffffff" opacity="0.4"/>
          <text x="718" y="750" font-family="monospace, sans-serif" font-size="11" font-weight="bold" fill="#fde68a" text-anchor="middle">VOL</text>
        </g>

        <!-- 3. Lower Chunky Brass/Bakelite Knob (TUNING) -->
        <g id="knobTuning">
          <!-- Drop Shadow -->
          <circle cx="718" cy="792" r="44" fill="#000000" opacity="0.6"/>
          <!-- Outer Knurled Brass Ring -->
          <circle cx="718" cy="788" r="42" fill="url(#brassBezel)"/>
          <!-- Inner Dark Bakelite Core -->
          <circle cx="718" cy="788" r="32" fill="#181410" stroke="#78350f" stroke-width="2"/>
          <!-- Tuning Notch Indicator Line (Pointing at ~2 o'clock) -->
          <line x1="718" y1="788" x2="738" y2="768" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>
          <!-- Center Spun Brass Cap -->
          <circle cx="718" cy="788" r="14" fill="url(#brassSpun)"/>
          <circle cx="715" cy="785" r="4" fill="#ffffff" opacity="0.4"/>
          <text x="718" y="842" font-family="monospace, sans-serif" font-size="11" font-weight="900" fill="#f59e0b" text-anchor="middle">TUNING</text>
        </g>
      </g>
    </g>
  </g>
  
</svg>